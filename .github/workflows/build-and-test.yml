name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Main Project
      run: dotnet build BasucuIDE/mdaiAgent.csproj -c Release

    - name: Run 201 Automated Unit Tests
      run: dotnet test tests/mdaiAgent.Tests/mdaiAgent.Tests.csproj -c Release --logger "trx;LogFileName=test_results.trx"
