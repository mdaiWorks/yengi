<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mdaiAgent - Tema Seçici</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: #0f0f0f;
            color: #ffffff;
        }
        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-weight: 300;
        }
        .themes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .theme-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .theme-preview {
            padding: 30px;
            position: relative;
        }
        .theme-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .color-swatches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .swatch {
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-family: monospace;
            color: rgba(255,255,255,0.7);
        }
        .theme-info {
            padding: 20px;
            background: rgba(0,0,0,0.3);
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            transform: scale(1.05);
        }
        .selected-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
        }
        .theme-card.selected .selected-badge {
            display: block;
        }
        .theme-card.selected {
            outline: 3px solid #00ff88;
        }
        .theme-code {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .theme-card.selected .theme-code {
            display: block;
        }
        .copy-btn {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>🎨 mdaiAgent - Tema Seçici</h1>
    <p style="text-align: center; margin-bottom: 40px; color: #888;">Beğendiğin temayı seç ve kodunu kopyala!</p>
    
    <div class="themes-container" id="themesContainer"></div>

    <script>
        const themes = [
            {
                name: "1. Slate Blue (Koyu Mavi)",
                bg: "#0d1117",
                surface: "#161b22",
                surfaceAlt1: "#21262d",
                surfaceAlt2: "#30363d",
                accent: "#58a6ff",
                accent2: "#8b949e",
                textPrimary: "#c9d1d9",
                textSecondary: "#8b949e",
                divider: "#30363d",
                success: "#3fb950",
                warning: "#d29922",
                error: "#f85149"
            },
            {
                name: "2. Dracula (Popüler)",
                bg: "#1a1b1d",
                surface: "#21222c",
                surfaceAlt1: "#282a36",
                surfaceAlt2: "#44475a",
                accent: "#bd93f9",
                accent2: "#ff79c6",
                textPrimary: "#f8f8f2",
                textSecondary: "#6272a4",
                divider: "#44475a",
                success: "#50fa7b",
                warning: "#f1fa8c",
                error: "#ff5555"
            },
            {
                name: "3. Solarized Dark",
                bg: "#002b36",
                surface: "#073642",
                surfaceAlt1: "#586e75",
                surfaceAlt2: "#657b83",
                accent: "#2aa198",
                accent2: "#b58900",
                textPrimary: "#839496",
                textSecondary: "#586e75",
                divider: "#586e75",
                success: "#859900",
                warning: "#b58900",
                error: "#dc322f"
            },
            {
                name: "4. Tokyo Night",
                bg: "#1a1b26",
                surface: "#16161e",
                surfaceAlt1: "#24283b",
                surfaceAlt2: "#414868",
                accent: "#7aa2f7",
                accent2: "#bb9af7",
                textPrimary: "#c0caf5",
                textSecondary: "#a9b1d6",
                divider: "#3b4261",
                success: "#9ece6a",
                warning: "#e0af68",
                error: "#f7768e"
            },
            {
                name: "5. Monokai Pro",
                bg: "#2d2a2e",
                surface: "#383539",
                surfaceAlt1: "#403e41",
                surfaceAlt2: "#575458",
                accent: "#ff6188",
                accent2: "#a9dc76",
                textPrimary: "#fcfcfa",
                textSecondary: "#939293",
                divider: "#575458",
                success: "#a9dc76",
                warning: "#fc9867",
                error: "#ff6188"
            },
            {
                name: "6. Nord (Mavi Yeşil)",
                bg: "#2e3440",
                surface: "#3b4252",
                surfaceAlt1: "#434c5e",
                surfaceAlt2: "#4c566a",
                accent: "#88c0d0",
                accent2: "#81a1c1",
                textPrimary: "#eceff4",
                textSecondary: "#d8dee9",
                divider: "#4c566a",
                success: "#a3be8c",
                warning: "#ebcb8b",
                error: "#bf616a"
            },
            {
                name: "7. Catppuccin Mocha",
                bg: "#11111b",
                surface: "#181825",
                surfaceAlt1: "#1e1e2e",
                surfaceAlt2: "#313244",
                accent: "#cba6f7",
                accent2: "#f5c2e7",
                textPrimary: "#cdd6f4",
                textSecondary: "#a6adc8",
                divider: "#45475a",
                success: "#a6e3a1",
                warning: "#f9e2af",
                error: "#f38ba8"
            },
            {
                name: "8. One Dark Pro",
                bg: "#1e2127",
                surface: "#21252b",
                surfaceAlt1: "#282c34",
                surfaceAlt2: "#3e4451",
                accent: "#61afef",
                accent2: "#98c379",
                textPrimary: "#abb2bf",
                textSecondary: "#5c6370",
                divider: "#3e4451",
                success: "#98c379",
                warning: "#d19a66",
                error: "#e06c75"
            }
        ];

        const container = document.getElementById('themesContainer');
        let selectedThemeIndex = -1;

        function createThemeCard(theme, index) {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.style.background = theme.surface;
            
            card.innerHTML = `
                <div class="theme-preview" style="background: ${theme.bg};">
                    <div class="selected-badge">✓ Seçildi</div>
                    <h2 class="theme-name" style="color: ${theme.accent};">${theme.name}</h2>
                    <div class="color-swatches">
                        <div class="swatch" style="background: ${theme.bg}">BG</div>
                        <div class="swatch" style="background: ${theme.surface}">SURF</div>
                        <div class="swatch" style="background: ${theme.accent}">ACC</div>
                        <div class="swatch" style="background: ${theme.textPrimary}">TXT</div>
                        <div class="swatch" style="background: ${theme.error}">ERR</div>
                    </div>
                    <div style="font-family: Consolas, monospace; font-size: 13px; padding: 15px; background: ${theme.surface}; border-radius: 8px; color: ${theme.textPrimary};">
                        <span style="color: ${theme.accent}">const</span> <span style="color: ${theme.accent2}">mdaiAgent</span> = <span style="color: ${theme.success}">"harika"</span>;
                    </div>
                    <div class="theme-code" id="code-${index}">
                        <h3 style="margin-top: 0; color: ${theme.textPrimary};">XAML Kodu:</h3>
                        <pre id="xaml-${index}" style="color: ${theme.textSecondary}"></pre>
                        <button class="copy-btn" onclick="copyCode(${index})" style="background: ${theme.accent}; color: ${theme.bg};">
                            Kopyala
                        </button>
                    </div>
                </div>
                <div class="theme-info" style="color: ${theme.textSecondary};">
                    <p style="margin: 0;">Arka plan: <strong style="color: ${theme.textPrimary};">${theme.bg}</strong></p>
                    <p style="margin: 10px 0 0 0;">Vurgu: <strong style="color: ${theme.textPrimary};">${theme.accent}</strong></p>
                </div>
            `;
            
            card.onclick = () => selectTheme(index);
            return card;
        }

        function generateXAML(theme) {
            return `<ResourceDictionary xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

  <!-- Colors -->
  <Color x:Key="PrimaryColor">${theme.accent}</Color>
  <Color x:Key="AccentColor">${theme.accent2}</Color>
  <Color x:Key="SecondaryColor">${theme.textSecondary}</Color>
  <Color x:Key="SurfaceColor">${theme.surface}</Color>
  <Color x:Key="SurfaceAlt1">${theme.surfaceAlt1}</Color>
  <Color x:Key="SurfaceAlt2">${theme.surfaceAlt2}</Color>
  <Color x:Key="BackgroundColor">${theme.bg}</Color>
  <Color x:Key="PanelColor">${theme.surface}</Color>
  <Color x:Key="TextPrimaryColor">${theme.textPrimary}</Color>
  <Color x:Key="TextSecondaryColor">${theme.textSecondary}</Color>
  <Color x:Key="DividerColor">${theme.divider}</Color>
  <Color x:Key="SuccessColor">${theme.success}</Color>
  <Color x:Key="WarningColor">${theme.warning}</Color>
  <Color x:Key="ErrorColor">${theme.error}</Color>

  <!-- Brushes -->
  <SolidColorBrush x:Key="PrimaryBrush" Color="{StaticResource PrimaryColor}"/>
  <SolidColorBrush x:Key="AccentBrush" Color="{StaticResource AccentColor}"/>
  <SolidColorBrush x:Key="SecondaryBrush" Color="{StaticResource SecondaryColor}"/>
  <SolidColorBrush x:Key="SurfaceBrush" Color="{StaticResource SurfaceColor}"/>
  <SolidColorBrush x:Key="SurfaceAlt1Brush" Color="{StaticResource SurfaceAlt1}"/>
  <SolidColorBrush x:Key="SurfaceAlt2Brush" Color="{StaticResource SurfaceAlt2}"/>
  <SolidColorBrush x:Key="BackgroundBrush" Color="{StaticResource BackgroundColor}"/>
  <SolidColorBrush x:Key="PanelBrush" Color="{StaticResource PanelColor}"/>
  <SolidColorBrush x:Key="TextPrimaryBrush" Color="{StaticResource TextPrimaryColor}"/>
  <SolidColorBrush x:Key="TextSecondaryBrush" Color="{StaticResource TextSecondaryColor}"/>
  <SolidColorBrush x:Key="DividerBrush" Color="{StaticResource DividerColor}"/>
  <SolidColorBrush x:Key="SuccessBrush" Color="{StaticResource SuccessColor}"/>
  <SolidColorBrush x:Key="WarningBrush" Color="{StaticResource WarningColor}"/>
  <SolidColorBrush x:Key="ErrorBrush" Color="{StaticResource ErrorColor}"/>
  
  <!-- Compatibility aliases (keep these for existing code) -->
  <SolidColorBrush x:Key="DarkBackground" Color="{StaticResource BackgroundColor}"/>
  <SolidColorBrush x:Key="DarkPanelBackground" Color="{StaticResource PanelColor}"/>
  <SolidColorBrush x:Key="DarkBorder" Color="{StaticResource DividerColor}"/>
  <SolidColorBrush x:Key="DarkText" Color="{StaticResource TextPrimaryColor}"/>
  <SolidColorBrush x:Key="DarkAccentLight" Color="{StaticResource AccentColor}"/>
  <SolidColorBrush x:Key="DarkAccent" Color="{StaticResource AccentColor}"/>
  <SolidColorBrush x:Key="DarkHover" Color="{StaticResource SurfaceAlt1}"/>
  <SolidColorBrush x:Key="DarkSelection" Color="{StaticResource AccentColor}"/>
  <SolidColorBrush x:Key="CardBrush" Color="{StaticResource SurfaceAlt1}"/>
  <SolidColorBrush x:Key="SubtleTextBrush" Color="{StaticResource TextSecondaryColor}"/>
  <SolidColorBrush x:Key="ToolbarBrush" Color="{StaticResource PanelColor}"/>
  <SolidColorBrush x:Key="AccentBorderBrush" Color="{StaticResource AccentColor}"/>

  <!-- Accent gradient -->
  <LinearGradientBrush x:Key="AccentGradient" StartPoint="0,0" EndPoint="1,1">
    <GradientStop Color="{StaticResource AccentColor}" Offset="0"/>
    <GradientStop Color="{StaticResource PrimaryColor}" Offset="1"/>
  </LinearGradientBrush>

</ResourceDictionary>`;
        }

        function selectTheme(index) {
            selectedThemeIndex = index;
            document.querySelectorAll('.theme-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });
        }

        function copyCode(index) {
            const code = document.getElementById(`xaml-${index}`).textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Tema kodu panoya kopyalandı! Şimdi ModernPalette.xaml dosyasına yapıştırabilirsin!');
            });
        }

        themes.forEach((theme, index) => {
            container.appendChild(createThemeCard(theme, index));
            document.getElementById(`xaml-${index}`).textContent = generateXAML(theme);
        });
    </script>
</body>
</html>
